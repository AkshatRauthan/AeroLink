version: "3.9"

services:
  # ---------------------------
  # RabbitMQ
  # ---------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: aerolink-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: aerolink
      RABBITMQ_DEFAULT_PASS: aerolinkpass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - aerolink-net

  # ---------------------------
  # Kafka (KRaft mode — no Zookeeper needed)
  # ---------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: aerolink-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - aerolink-net

  # Optional: Kafka UI for local debugging
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aerolink-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - aerolink-net

  # ---------------------------
  # Redis
  # ---------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    container_name: aerolink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aerolink-net

networks:
  aerolink-net:
    driver: bridge

volumes:
  rabbitmq_data:
  kafka_data:
  redis_data: